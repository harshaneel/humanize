name: skill-benchmark

on:
  pull_request:
    paths:
      - "humanize/SKILL.md"
      - ".github/benchmark/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # Keyless (localaik executor), so fork PRs can run too; only the comment step needs write access.
    timeout-minutes: 300
    env:
      BENCH: .github/benchmark
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start localaik (local LLM, OpenAI-compatible)
        run: |
          # Skill (~8k tokens) + input + output must fit the context window.
          docker run -d --name localaik -p 8090:8090 -e LK_CTX_SIZE=20480 gokhalh/localaik
          echo "Waiting for localaik health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8090/health >/dev/null 2>&1; then
              echo "localaik is up"; exit 0
            fi
            sleep 5
          done
          echo "localaik failed to become healthy"; docker logs localaik; exit 1

      - name: Cache HF models (Binoculars scorer)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tinyllama-binoculars-v1

      - name: Install dependencies
        run: |
          pip install --quiet torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers==5.9.0 accelerate==1.13.0 numpy==2.4.6 openai
          git clone https://github.com/ahans30/Binoculars.git /tmp/binoculars-src
          git -C /tmp/binoculars-src checkout c8ae2f90d50ee696418bc71d8d9e5020e5f9d7b8
          pip install --quiet --no-deps -e /tmp/binoculars-src

      - name: Extract base-branch skill
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || 'origin/main' }}"
          git show "$BASE_REF:humanize/SKILL.md" > /tmp/skill_base.md
          echo "Base skill: $(wc -w < /tmp/skill_base.md) words ($BASE_REF)"
          echo "PR skill:   $(wc -w < humanize/SKILL.md) words"

      - name: Humanize with base skill
        run: |
          python $BENCH/humanize_batch.py --skill /tmp/skill_base.md \
            --inputs $BENCH/inputs.json --output /tmp/outputs-base.json

      - name: Humanize with PR skill
        run: |
          python $BENCH/humanize_batch.py --skill humanize/SKILL.md \
            --inputs $BENCH/inputs.json --output /tmp/outputs-pr.json

      - name: Score with Binoculars and build report
        run: |
          python $BENCH/score_and_report.py \
            --inputs $BENCH/inputs.json \
            --base-outputs /tmp/outputs-base.json \
            --pr-outputs /tmp/outputs-pr.json \
            --report /tmp/report.md --json-out /tmp/results.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-outputs
          path: |
            /tmp/outputs-base.json
            /tmp/outputs-pr.json
            /tmp/results.json
            /tmp/report.md

      - name: Post or update PR comment
        # GITHUB_TOKEN is read-only on fork PRs; skip the comment there (artifact still has the report).
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf8');
            const marker = '<!-- humanize-benchmark -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
