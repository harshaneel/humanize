name: scenario-tests

on:
  # Same-repo PRs: workflow and code run from the PR branch (trusted).
  pull_request:
    paths:
      - "humanize/SKILL.md"
      - "ai-check/SKILL.md"
      - "tests/SCENARIOS.md"
      - ".github/benchmark/scenarios.json"
      - ".github/benchmark/run_scenarios.py"
      - ".github/workflows/scenario-tests.yml"
  # Fork PRs: workflow and ALL code run from the base branch; only the fork's skill
  # files are fetched, as prompt data. Fork code never executes here.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "humanize/SKILL.md"
      - "ai-check/SKILL.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: scenarios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BENCH: .github/benchmark
  EXECUTOR_MODEL: gemini-flash-lite-latest
  EXECUTOR_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/

jobs:
  scenarios:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    environment: benchmark
    timeout-minutes: 45
    steps:
      # For pull_request this checks out the PR merge ref; for pull_request_target it
      # checks out the BASE branch (safe default) — fork code is never checked out.
      - uses: actions/checkout@v4

      - name: Take the fork PR's skill files as data (fork PRs only)
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch origin "pull/${{ github.event.pull_request.number }}/head"
          git checkout FETCH_HEAD -- humanize/SKILL.md ai-check/SKILL.md
          echo "Testing fork skills: humanize $(wc -w < humanize/SKILL.md)w, ai-check $(wc -w < ai-check/SKILL.md)w"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install client deps
        run: pip install --quiet openai

      - name: Run scenario fixtures
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python $BENCH/run_scenarios.py \
            --scenarios $BENCH/scenarios.json \
            --humanize-skill humanize/SKILL.md \
            --ai-check-skill ai-check/SKILL.md \
            --model "$EXECUTOR_MODEL" --base-url "$EXECUTOR_BASE_URL" \
            --min-pass 6 \
            --report /tmp/scenario-report.md --json-out /tmp/scenario-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results
          path: |
            /tmp/scenario-results.json
            /tmp/scenario-report.md
          overwrite: true

      - name: Post or update PR comment
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/scenario-report.md')) {
              core.warning('No report produced; skipping comment.');
              return;
            }
            const body = fs.readFileSync('/tmp/scenario-report.md', 'utf8');
            const marker = '<!-- humanize-scenarios -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce scenario results
        run: |
          python -c "import json,sys; r=json.load(open('/tmp/scenario-results.json')); sys.exit(0 if r['pass'] else 1)"
